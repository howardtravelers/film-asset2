<style>
/* =========================================================
   FILM ASSET MAX
   Mobile First / iOS Inspired Design System
========================================================= */

:root {
    --bg-color: #f5f5f3;
    --card-bg: rgba(255,255,255,.94);

    --text-main: #181818;
    --text-sub: #777777;
    --text-muted: #9b9b9b;

    --accent: #d35400;
    --accent-hover: #e67e22;
    --accent-light: #fff0e6;

    --border-light: #e7e7e5;

    --input-bg: #f0f0ee;
    --input-focus: #ffffff;
    --box-inner-bg: #f8f8f6;

    --success: #16833b;
    --success-bg: #e8f7ed;

    --warning: #b86b00;
    --warning-bg: #fff4dc;

    --danger: #d92d20;
    --danger-bg: #fff0ef;

    --lab: #7c3aed;
    --lab-bg: #f1eaff;

    --sprocket-color: #171717;

    --glow-color: rgba(211,84,0,.18);

    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 26px;

    --shadow-card:
        0 1px 2px rgba(0,0,0,.03),
        0 8px 30px rgba(0,0,0,.045);

    --shadow-float:
        0 12px 30px rgba(0,0,0,.18);

    --transition:
        all .2s cubic-bezier(.4,0,.2,1);
}

:root[data-theme="dark"] {
    --bg-color: #101010;
    --card-bg: #1a1a1a;

    --text-main: #f3f3f3;
    --text-sub: #a0a0a0;
    --text-muted: #727272;

    --accent: #f28a3b;
    --accent-hover: #ff9b4d;
    --accent-light: #382014;

    --border-light: #303030;

    --input-bg: #242424;
    --input-focus: #1b1b1b;
    --box-inner-bg: #202020;

    --success: #5bd889;
    --success-bg: #173521;

    --warning: #f4b74a;
    --warning-bg: #392d16;

    --danger: #ff6258;
    --danger-bg: #391918;

    --lab: #b084ff;
    --lab-bg: #291d3e;

    --sprocket-color: #000000;

    --glow-color: rgba(242,138,59,.25);

    --shadow-card:
        0 1px 2px rgba(0,0,0,.3),
        0 10px 30px rgba(0,0,0,.18);
}

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0 auto;

    max-width: 720px;

    min-height: 100vh;

    padding:
        calc(8px + env(safe-area-inset-top))
        16px
        calc(120px + env(safe-area-inset-bottom));

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(211,84,0,.07),
            transparent 38%
        ),
        var(--bg-color);

    color: var(--text-main);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    line-height: 1.5;

    -webkit-font-smoothing: antialiased;

    transition:
        background-color .25s ease,
        color .25s ease;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}

button:disabled {
    opacity: .5;
    pointer-events: none;
}

.hidden {
    display: none !important;
}

/* =========================================================
   HEADER
========================================================= */

.header-container {
    position: sticky;

    top: 0;

    z-index: 50;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin:
        0 -16px
        18px;

    padding:
        13px 16px
        13px;

    background:
        color-mix(
            in srgb,
            var(--bg-color) 88%,
            transparent
        );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border-bottom:
        1px solid transparent;
}

.header-container h1 {
    margin: 0;

    font-size: 20px;

    font-weight: 850;

    letter-spacing: .3px;

    white-space: nowrap;
}

.header-actions {
    display: flex;

    align-items: center;

    gap: 6px;
}

.theme-toggle {
    height: 42px;

    border:
        1px solid var(--border-light);

    border-radius: 999px;

    background: var(--card-bg);

    color: var(--text-main);

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 2px 10px rgba(0,0,0,.04);

    transition: var(--transition);
}

.theme-toggle:active {
    transform: scale(.95);
}

.btn-gear-room {
    padding: 0 14px;

    font-size: 13px;

    font-weight: 750;
}

.btn-round {
    width: 42px;

    padding: 0;

    font-size: 17px;
}

/* =========================================================
   HERO
========================================================= */

.hero-card {
    position: relative;

    overflow: hidden;

    padding: 22px;

    margin-bottom: 18px;

    border-radius: var(--radius-xl);

    background:
        linear-gradient(
            145deg,
            var(--card-bg),
            color-mix(
                in srgb,
                var(--card-bg) 88%,
                var(--accent-light)
            )
        );

    border:
        1px solid var(--border-light);

    box-shadow: var(--shadow-card);
}

.hero-card::after {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    right: -70px;
    top: -70px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            var(--accent-light),
            transparent 70%
        );

    pointer-events: none;
}

.hero-eyebrow {
    position: relative;

    z-index: 1;

    margin-bottom: 5px;

    color: var(--accent);

    font-size: 11px;

    font-weight: 850;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.hero-title {
    position: relative;

    z-index: 1;

    margin: 0;

    font-size: 27px;

    line-height: 1.15;

    font-weight: 850;
}

.hero-subtitle {
    position: relative;

    z-index: 1;

    margin: 7px 0 18px;

    color: var(--text-sub);

    font-size: 13px;
}

.hero-kpis {
    position: relative;

    z-index: 1;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}

.hero-kpi {
    padding: 12px;

    border-radius: 14px;

    background: color-mix(
        in srgb,
        var(--card-bg) 70%,
        transparent
    );

    border:
        1px solid var(--border-light);
}

.hero-kpi .num {
    display: block;

    font-size: 22px;

    font-weight: 850;

    line-height: 1;
}

.hero-kpi .lbl {
    display: block;

    margin-top: 5px;

    color: var(--text-sub);

    font-size: 10px;

    font-weight: 650;
}

/* =========================================================
   SECTION
========================================================= */

.section-title {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin:
        26px 2px
        10px;

    color: var(--text-sub);

    font-size: 11px;

    font-weight: 850;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.section-title button {
    flex-shrink: 0;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn-inline {
    min-height: 36px;

    padding: 8px 12px;

    border: none;

    border-radius: 999px;

    background: var(--input-bg);

    color: var(--text-main);

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;

    transition: var(--transition);
}

.btn-inline:active {
    transform: scale(.96);
}

.btn-main {
    width: 100%;

    min-height: 50px;

    padding: 14px 16px;

    margin-top: 20px;

    border: none;

    border-radius: var(--radius-md);

    background: var(--text-main);

    color: var(--bg-color);

    font-size: 15px;

    font-weight: 800;

    letter-spacing: .2px;

    cursor: pointer;

    box-shadow:
        0 6px 14px rgba(0,0,0,.08);

    transition: var(--transition);
}

.btn-main:active {
    transform: scale(.985);
}

.btn-main.update-btn {
    background: var(--accent);

    color: #fff;
}

.btn-export {
    width: 100%;

    min-height: 48px;

    padding: 13px 16px;

    margin: 8px 0;

    border:
        1px solid var(--border-light);

    border-radius: 14px;

    background: var(--card-bg);

    color: var(--text-main);

    font-size: 13px;

    font-weight: 750;

    cursor: pointer;

    box-shadow:
        0 2px 8px rgba(0,0,0,.02);
}

/* =========================================================
   FORM
========================================================= */

.card {
    padding: 18px;

    margin-bottom: 18px;

    border:
        1px solid var(--border-light);

    border-radius: var(--radius-lg);

    background: var(--card-bg);

    box-shadow: var(--shadow-card);
}

.fridge-card {
    border-style: dashed;
}

.flex-row {
    display: flex;

    gap: 10px;

    width: 100%;
}

.flex-row > * {
    min-width: 0;

    flex: 1;
}

.input-group {
    display: flex;

    align-items: center;

    gap: 8px;
}

.input-group > * {
    min-width: 0;
}

label {
    display: block;

    margin:
        17px 0
        7px;

    color: var(--text-sub);

    font-size: 12px;

    font-weight: 750;
}

select,
input,
textarea {
    width: 100%;

    min-height: 48px;

    padding: 12px 14px;

    border:
        1px solid transparent;

    border-radius: var(--radius-md);

    background: var(--input-bg);

    color: var(--text-main);

    font-size: 16px !important;

    outline: none;

    appearance: none;

    color-scheme: light dark;

    transition:
        border .15s ease,
        background .15s ease,
        box-shadow .15s ease;
}

textarea {
    resize: vertical;

    min-height: 90px;
}

select:focus,
input:focus,
textarea:focus {
    background: var(--input-focus);

    border-color: var(--accent);

    box-shadow:
        0 0 0 3px var(--accent-light);
}

.btn-add {
    flex-shrink: 0;

    width: 48px;

    height: 48px;

    padding: 0;

    border: none;

    border-radius: 13px;

    background: var(--text-main);

    color: var(--bg-color);

    font-size: 18px;

    cursor: pointer;
}

/* =========================================================
   ADVANCED FIELDS
========================================================= */

.hidden-group {
    display: none;

    margin-top: 14px;

    padding: 15px;

    border:
        1px solid var(--border-light);

    border-radius: 15px;

    background: var(--box-inner-bg);
}

.btn-quick-action {
    width: 100%;

    min-height: 46px;

    margin-top: 16px;

    padding: 11px 14px;

    border:
        1px solid var(--border-light);

    border-radius: 13px;

    background: var(--input-bg);

    color: var(--text-main);

    font-size: 13px;

    font-weight: 750;

    text-align: left;

    cursor: pointer;
}

/* =========================================================
   INVENTORY
========================================================= */

.inventory-summary {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 12px;
}

.inventory-summary strong {
    font-size: 14px;
}

.inventory-summary span {
    color: var(--text-sub);

    font-size: 12px;
}

.fridge-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 13px;

    margin-bottom: 9px;

    border:
        1px solid var(--border-light);

    border-radius: 14px;

    background: var(--card-bg);
}

.fridge-info {
    min-width: 0;

    flex: 1;
}

.fridge-name {
    font-size: 14px;

    font-weight: 800;
}

.fridge-meta {
    margin-top: 4px;

    color: var(--text-sub);

    font-size: 11px;
}

.fridge-actions {
    display: flex;

    gap: 5px;
}

.stock-good {
    color: var(--success);
}

.stock-warning {
    color: var(--warning);
}

.stock-danger {
    color: var(--danger);
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin-bottom: 10px;
}

.dash-card {
    min-width: 0;

    padding: 15px;

    border:
        1px solid var(--border-light);

    border-radius: 16px;

    background: var(--card-bg);

    box-shadow: var(--shadow-card);
}

.dash-card.full-width {
    grid-column: 1 / -1;
}

.dash-card h4 {
    margin: 0 0 7px;

    color: var(--text-sub);

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .8px;

    text-transform: uppercase;
}

.dash-card .value {
    margin: 0;

    color: var(--text-main);

    font-size: 24px;

    font-weight: 850;

    line-height: 1.2;
}

.dash-card .value.accent {
    color: var(--accent);
}

.chart-container {
    position: relative;

    width: 100%;

    height: 210px;

    margin-top: 8px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-bar {
    display: flex;

    align-items: center;

    gap: 6px;

    min-height: 48px;

    padding: 0 12px;

    margin-bottom: 14px;

    border:
        1px solid var(--border-light);

    border-radius: 14px;

    background: var(--input-bg);
}

.search-bar span {
    font-size: 15px;

    opacity: .7;
}

.search-bar input {
    min-height: 46px;

    padding:
        8px;

    border: none;

    background: transparent;

    box-shadow: none;
}

/* =========================================================
   RECORD CARD
========================================================= */

.record-item {
    position: relative;

    overflow: hidden;

    padding:
        23px 17px
        17px;

    margin-bottom: 14px;

    border:
        1px solid var(--border-light);

    border-radius: var(--radius-lg);

    background: var(--card-bg);

    box-shadow: var(--shadow-card);

    transition:
        transform .3s ease,
        opacity .3s ease;
}

.record-item::before,
.record-item::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    height: 8px;

    background-image:
        repeating-linear-gradient(
            90deg,
            var(--sprocket-color),
            var(--sprocket-color) 10px,
            transparent 10px,
            transparent 21px
        );

    background-size: 21px 8px;

    opacity: .95;
}

.record-item::before {
    top: 0;

    border-bottom:
        1px solid var(--border-light);
}

.record-item::after {
    bottom: 0;

    border-top:
        1px solid var(--border-light);
}

.record-item.chem-fade-out {
    transform:
        translateX(100%)
        scale(.94);

    opacity: 0;
}

.record-heading {
    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 10px;
}

.record-camera {
    font-size: 18px;

    font-weight: 850;

    line-height: 1.2;
}

.record-film {
    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 5px;

    color: var(--text-sub);

    font-size: 13px;

    font-weight: 650;
}

.record-film .separator {
    opacity: .5;
}

.record-setting {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    margin-top: 12px;
}

.setting-chip {
    padding: 5px 8px;

    border-radius: 999px;

    background: var(--input-bg);

    color: var(--text-sub);

    font-size: 10px;

    font-weight: 700;
}

.record-info-box {
    margin-top: 15px;

    padding: 11px 13px;

    border:
        1px solid var(--border-light);

    border-radius: 12px;

    background: var(--box-inner-bg);

    color: var(--text-sub);

    font-size: 12px;

    line-height: 1.65;
}

.record-info-box strong {
    color: var(--text-main);
}

.record-note-row {
    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    gap: 12px;

    margin-top: 13px;
}

.record-note {
    min-width: 0;

    color: var(--text-sub);

    font-size: 12px;
}

.record-cost {
    flex-shrink: 0;

    color: var(--accent);

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    font-size: 14px;

    font-weight: 850;
}

/* =========================================================
   STATUS
========================================================= */

.status-badge {
    flex-shrink: 0;

    display: inline-flex;

    align-items: center;

    min-height: 27px;

    padding:
        5px 9px;

    border-radius: 999px;

    font-size: 10px;

    font-weight: 850;

    letter-spacing: .3px;

    white-space: nowrap;
}

.status-shooting {
    background: var(--accent-light);

    color: var(--accent);
}

.status-unloaded {
    background: var(--input-bg);

    color: var(--text-sub);
}

.status-lab {
    background: var(--lab-bg);

    color: var(--lab);
}

.status-done {
    background: var(--success-bg);

    color: var(--success);
}

/* =========================================================
   TIMELINE
========================================================= */

.visual-timeline {
    position: relative;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    margin:
        23px 5px
        25px;
}

.visual-timeline::before {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    top: 4px;

    height: 2px;

    background: var(--border-light);

    z-index: 1;
}

.timeline-track {
    position: absolute;

    left: 0;

    top: 4px;

    height: 2px;

    background: var(--accent);

    z-index: 1;

    transition: width .4s ease;
}

.timeline-dot {
    position: relative;

    z-index: 2;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: var(--border-light);

    box-shadow:
        0 0 0 2px var(--card-bg);

    transition: var(--transition);
}

.timeline-dot.active {
    background: var(--accent);

    box-shadow:
        0 0 0 3px var(--accent-light),
        0 0 9px var(--glow-color);

    transform: scale(1.15);
}

.timeline-lbl {
    position: absolute;

    top: 14px;

    left: 50%;

    transform: translateX(-50%);

    color: var(--text-sub);

    font-size: 9px;

    font-weight: 650;

    white-space: nowrap;
}

/* =========================================================
   SMART ACTION
========================================================= */

.smart-action-group {
    margin-top: 14px;
}

.btn-smart-action {
    width: 100%;

    min-height: 44px;

    padding:
        10px 14px;

    border:
        1px solid color-mix(
            in srgb,
            var(--accent) 25%,
            transparent
        );

    border-radius: 999px;

    background: var(--accent-light);

    color: var(--accent);

    font-size: 13px;

    font-weight: 800;

    cursor: pointer;

    transition: var(--transition);
}

.btn-smart-action:active {
    transform: scale(.98);
}

/* =========================================================
   ACTION BAR
========================================================= */

.pro-action-bar {
    display: flex;

    align-items: center;

    gap: 6px;

    margin-top: 12px;

    padding-top: 12px;

    border-top:
        1px solid var(--border-light);
}

.pro-action-bar button {
    min-height: 40px;

    padding:
        8px 10px;

    border:
        1px solid var(--border-light);

    border-radius: 11px;

    background: var(--card-bg);

    color: var(--text-main);

    font-size: 11px;

    font-weight: 750;

    cursor: pointer;
}

.pro-action-bar .btn-pro-edit {
    flex: 1.4;

    background: var(--text-main);

    color: var(--bg-color);

    border-color: transparent;
}

.pro-action-bar .btn-pro-link {
    flex: 1;

    border-color: var(--accent);

    color: var(--accent);

    background: transparent;
}

.pro-action-bar .btn-pro-delete {
    flex:
        0 0 40px;

    width: 40px;

    padding: 0;

    color: var(--danger);

    background: transparent;

    opacity: .6;
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty-state {
    padding: 45px 20px;

    text-align: center;

    color: var(--text-sub);
}

.empty-icon {
    margin-bottom: 10px;

    font-size: 34px;

    opacity: .5;
}

.empty-state strong {
    display: block;

    margin-bottom: 5px;

    color: var(--text-main);

    font-size: 14px;
}

.empty-state p {
    margin: 0;

    font-size: 12px;
}

/* =========================================================
   FAB
========================================================= */

.fab-container {
    position: fixed;

    right: 16px;

    bottom:
        calc(16px + env(safe-area-inset-bottom));

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;
}

.fab-sub {
    width: 46px;
    height: 46px;

    padding: 0;

    border:
        1px solid var(--border-light);

    border-radius: 50%;

    background: var(--card-bg);

    color: var(--text-main);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 17px;

    box-shadow:
        0 7px 20px rgba(0,0,0,.12);

    cursor: pointer;

    transform:
        translateY(18px)
        scale(.75);

    opacity: 0;

    pointer-events: none;

    transition:
        transform .25s cubic-bezier(.4,0,.2,1),
        opacity .2s ease;
}

.fab-container.active .fab-sub {
    transform:
        translateY(0)
        scale(1);

    opacity: 1;

    pointer-events: auto;
}

.fab {
    width: 62px;
    height: 62px;

    padding: 0;

    border:
        3px solid var(--card-bg);

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #f28a3b,
            #c54b00
        );

    color: #fff;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow: var(--shadow-float);

    cursor: pointer;

    transition: transform .15s ease;
}

.fab:active {
    transform: scale(.91);
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 200;

    display: none;

    align-items: flex-end;

    justify-content: center;

    padding-bottom:
        env(safe-area-inset-bottom);

    background:
        rgba(0,0,0,.48);

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    opacity: 0;

    transition: opacity .25s ease;
}

.modal-overlay.show {
    display: flex;

    opacity: 1;
}

.modal-content {
    position: relative;

    width: min(100%, 720px);

    max-height: 92vh;

    overflow-y: auto;

    padding:
        11px 20px
        calc(28px + env(safe-area-inset-bottom));

    border-radius:
        27px 27px
        0 0;

    background: var(--bg-color);

    box-shadow:
        0 -15px 50px rgba(0,0,0,.2);

    transform:
        translateY(100%);

    transition:
        transform .3s cubic-bezier(.1,.8,.2,1);
}

.modal-overlay.show .modal-content {
    transform: translateY(0);
}

.modal-content::before {
    content: "";

    display: block;

    width: 38px;
    height: 4px;

    margin:
        0 auto
        17px;

    border-radius: 999px;

    background: var(--border-light);
}

.modal-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 15px;
}

.modal-header h3 {
    margin: 0;

    font-size: 20px;

    font-weight: 850;
}

.btn-close {
    flex-shrink: 0;

    width: 36px;
    height: 36px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background: var(--input-bg);

    color: var(--text-main);

    font-size: 15px;

    cursor: pointer;
}

/* =========================================================
   SEARCH / GEAR
========================================================= */

.gear-tabs {
    display: flex;

    gap: 6px;

    overflow-x: auto;

    margin-bottom: 12px;

    padding-bottom: 4px;

    scrollbar-width: none;
}

.gear-tabs::-webkit-scrollbar {
    display: none;
}

.gear-tabs button {
    flex: 1;

    min-width: 70px;

    min-height: 40px;

    padding: 8px 10px;

    border:
        1px solid var(--border-light);

    border-radius: 11px;

    background: var(--input-bg);

    color: var(--text-main);

    font-size: 12px;

    font-weight: 750;

    cursor: pointer;
}

.gear-tabs button.active {
    background: var(--text-main);

    color: var(--bg-color);

    border-color: var(--text-main);
}

.gear-list {
    display: flex;

    flex-direction: column;

    gap: 8px;

    max-height: 55vh;

    overflow-y: auto;
}

.gear-item {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 13px;

    border:
        1px solid var(--border-light);

    border-radius: 14px;

    background: var(--box-inner-bg);
}

.gear-item-main {
    min-width: 0;
}

.gear-item-name {
    display: block;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 14px;

    font-weight: 800;
}

.gear-item-meta {
    display: block;

    margin-top: 3px;

    color: var(--text-sub);

    font-size: 10px;
}

.gear-actions {
    display: flex;

    gap: 5px;
}

.gear-actions button {
    min-height: 34px;

    padding: 6px 10px;

    border: none;

    border-radius: 999px;

    font-size: 11px;

    font-weight: 750;

    cursor: pointer;
}

.btn-gear-edit {
    background: var(--input-bg);

    color: var(--text-main);
}

.btn-gear-del {
    background: var(--danger-bg);

    color: var(--danger);
}

/* =========================================================
   TOAST
========================================================= */

.toast-container {
    position: fixed;

    left: 16px;
    right: 16px;

    bottom:
        calc(92px + env(safe-area-inset-bottom));

    z-index: 500;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 8px;

    pointer-events: none;
}

.toast {
    display: flex;

    align-items: center;

    gap: 12px;

    max-width: 500px;

    padding:
        11px 13px;

    border:
        1px solid var(--border-light);

    border-radius: 14px;

    background:
        color-mix(
            in srgb,
            var(--card-bg) 95%,
            transparent
        );

    color: var(--text-main);

    box-shadow:
        0 10px 30px rgba(0,0,0,.15);

    font-size: 12px;

    font-weight: 700;

    backdrop-filter: blur(16px);

    animation:
        toastIn .25s ease both;
}

.toast.success {
    border-color:
        color-mix(
            in srgb,
            var(--success) 25%,
            transparent
        );
}

.toast.error {
    border-color:
        color-mix(
            in srgb,
            var(--danger) 25%,
            transparent
        );
}

.toast button {
    padding: 4px 8px;

    border: none;

    border-radius: 7px;

    background: var(--accent);

    color: #fff;

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;
}

@keyframes toastIn {
    from {
        opacity: 0;
        transform:
            translateY(12px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

/* =========================================================
   STOCK ALERT
========================================================= */

.stock-alert {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 10px;

    padding: 10px 12px;

    border-radius: 12px;

    background: var(--warning-bg);

    color: var(--warning);

    font-size: 11px;

    font-weight: 750;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 480px) {

    .hero-title {
        font-size: 24px;
    }

    .hero-kpi .num {
        font-size: 20px;
    }

    .flex-row {
        gap: 7px;
    }

    .record-camera {
        font-size: 17px;
    }
}

@media (min-width: 700px) {

    body {
        padding-left: 24px;
        padding-right: 24px;
    }

    .header-container {
        margin-left: -24px;
        margin-right: -24px;

        padding-left: 24px;
        padding-right: 24px;
    }

    .dashboard-grid {
        grid-template-columns:
            repeat(4, 1fr);
    }

    }
}

/* =========================================================
   PRINT
========================================================= */

@media print {

    body {
        background: #fff;

        color: #000;

    }

    }
}

<script>
/* =========================================================
   STORAGE
========================================================= */

let memoryStorage = {};

function safeGetStorage(key) {
    try {
        return localStorage.getItem(key);
    } catch (e) {
        return memoryStorage[key] || null;
    }
}

function safeSetStorage(key, value) {
    try {
        localStorage.setItem(key, value);
    } catch (e) {
        memoryStorage[key] = value;
    }
}

function safeParse(key, defaultValue) {
    try {
        const value = safeGetStorage(key);

        return value
            ? JSON.parse(value)
            : defaultValue;

    } catch (e) {
        return defaultValue;
    }
}


/* =========================================================
   STATE
========================================================= */

let customCameras = [];
let customFilms = [];
let customLenses = [];
let customLabs = [];

let filmRecords = safeParse(
    'filmTrackerRecords',
    []
);

let inventory = safeParse(
    'filmInventory',
    []
);

let filmChartInstance = null;
let gearChartInstance = null;

let currentGearTab = 'camera';

let editingIndex = -1;
let editingInvIndex = -1;

let quickLoadInvIndex = -1;

let smartActionRecIndex = -1;
let smartActionType = '';

let toastTimer = null;


/* =========================================================
   HELPERS
========================================================= */

function todayString() {
    return new Date()
        .toISOString()
        .split('T')[0];
}

function escapeHTML(value) {

    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function safeURL(value) {

    try {

        const url = new URL(
            String(value),
            window.location.href
        );

        if (
            url.protocol === 'http:' ||
            url.protocol === 'https:'
        ) {
            return url.href;
        }

    } catch (e) {}

    return '';
}

function formatMoney(value) {

    return (
        Number(value || 0)
            .toLocaleString('zh-TW')
    );
}

function getInventoryTotal() {

    return inventory.reduce(
        (sum, item) =>
            sum + (Number(item.qty) || 0),
        0
    );
}

function getStatusClass(status) {

    if (status === '已退片')
        return 'status-unloaded';

    if (status === '送洗中')
        return 'status-lab';

    if (status === '已完成')
        return 'status-done';

    return 'status-shooting';
}

function normalizeMonthString(str) {
    if (!str || str === '不可考') return str;
    const cleaned = str.replace(/\//g, '-');
    const parts = cleaned.split('-');
    if (parts.length >= 2) {
        const y = parts[0].padStart(4, '0');
        const m = parts[1].padStart(2, '0');
        return `${y}-${m}`;
    }
    return str;
}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type = 'success',
    actionText = '',
    actionFn = null
) {

    const container =
        document.getElementById(
            'toastContainer'
        );

    const toast =
        document.createElement('div');

    toast.className =
        `toast ${type}`;

    const text =
        document.createElement('span');

    text.textContent = message;

    toast.appendChild(text);

    if (actionFn) {

        const button =
            document.createElement('button');

        button.textContent =
            actionText || '復原';

        button.onclick = () => {

            actionFn();

            toast.remove();

        };

        toast.appendChild(button);
    }

    container.appendChild(toast);

    setTimeout(() => {

        toast.style.opacity = '0';
        toast.style.transform =
            'translateY(10px) scale(.96)';

        setTimeout(
            () => toast.remove(),
            250
        );

    }, actionFn ? 5000 : 2600);
}


/* =========================================================
   DATABASE
========================================================= */

function initDatabase() {

    const initialized =
        safeParse(
            'isGearInit_v11',
            false
        );

    if (!initialized) {

        customCameras = [
            {
                name: 'Nikon FM2',
                format: '135'
            },
            {
                name: 'Leica M6',
                format: '135'
            },
            {
                name: 'Hasselblad 500C/M',
                format: '120'
            }
        ];

        customFilms = [
            {
                name: 'Kodak Portra 400',
                iso: 400,
                exposures: 36,
                format: '135',
                colorType: 'Color'
            },
            {
                name: 'Kodak Gold 200',
                iso: 200,
                exposures: 36,
                format: '135',
                colorType: 'Color'
            },
            {
                name: 'ILFORD HP5 PLUS',
                iso: 400,
                exposures: 36,
                format: '135',
                colorType: 'B/W'
            }
        ];

        customLenses = [
            {
                name: '未記錄'
            },
            {
                name: '35mm'
            },
            {
                name: '50mm'
            }
        ];

        customLabs = [
            {
                name: '未指定'
            },
            {
                name: '自行沖洗'
            },
            {
                name: 'ILFORDTWLAB'
            }
        ];

        saveAllGear();

        safeSetStorage(
            'isGearInit_v11',
            'true'
        );

    } else {

        customCameras =
            safeParse(
                'customCameras',
                []
            );

        customFilms =
            safeParse(
                'customFilms',
                []
            );

        customLenses =
            safeParse(
                'customLenses',
                []
            );

        customLabs =
            safeParse(
                'customLabs',
                []
            );
    }

    // Auto-migrate legacy full expiry date strings (YYYY-MM-DD) to YYYY-MM
    let dateMigrated = false;
    inventory.forEach(item => {
        if (item.expiryDate && item.expiryDate !== '不可考') {
            const norm = normalizeMonthString(item.expiryDate);
            if (norm !== item.expiryDate) {
                item.expiryDate = norm;
                dateMigrated = true;
            }
        }
    });
    if (dateMigrated) {
        safeSetStorage('filmInventory', JSON.stringify(inventory));
    }
}


/* =========================================================
   APP INIT
========================================================= */

function initApp() {

    const savedTheme =
        safeGetStorage('theme');

    if (
        savedTheme === 'dark' ||
        (
            !savedTheme &&
            window.matchMedia &&
            window.matchMedia(
                '(prefers-color-scheme: dark)'
            ).matches
        )
    ) {

        document.documentElement
            .setAttribute(
                'data-theme',
                'dark'
            );

    }

    document.getElementById(
        'invPurchaseDate'
    ).value =
        todayString();

    initDatabase();

    renderDropdowns();

    renderInventory();

    renderRecords();

    renderStats();

    updateHero();

    toggleDynamicFields();

    updateThemeColor();
}


/* =========================================================
   THEME
========================================================= */

document
    .getElementById('themeBtn')
    .addEventListener(
        'click',
        function () {

            const isDark =
                document.documentElement
                    .getAttribute(
                        'data-theme'
                    ) === 'dark';

            if (isDark) {

                document.documentElement
                    .removeAttribute(
                        'data-theme'
                    );

                safeSetStorage(
                    'theme',
                    'light'
                );

            } else {

                document.documentElement
                    .setAttribute(
                        'data-theme',
                        'dark'
                    );

                safeSetStorage(
                    'theme',
                    'dark'
                );
            }

            updateThemeColor();

            renderStatsCharts();
        }
    );

function updateThemeColor() {

    const meta =
        document.querySelector(
            'meta[name="theme-color"]'
        );

    if (!meta) return;

    const isDark =
        document.documentElement
            .getAttribute(
                'data-theme'
            ) === 'dark';

    meta.setAttribute(
        'content',
        isDark
            ? '#101010'
            : '#f5f5f3'
    );
}


/* =========================================================
   FAB
========================================================= */

function toggleFabMenu() {

    document
        .getElementById(
            'fabContainer'
        )
        .classList.toggle(
            'active'
        );
}

function scrollToInventory() {

    const section =
        document.getElementById(
            'section-fridge'
        );

    section.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
    });

    const area =
        document.getElementById(
            'fridgeArea'
        );

    area.style.display = 'block';
}

function openQuickLoadFromFab() {

    if (inventory.length === 0) {

        scrollToInventory();

        showToast(
            '冰箱目前沒有底片',
            'error'
        );

        return;
    }

    initQuickLoad(0);
}


/* =========================================================
   MODALS
========================================================= */

function openModal(id) {

    const modal =
        document.getElementById(id);

    modal.style.display = 'flex';

    document.body.style.overflow =
        'hidden';

    requestAnimationFrame(() => {

        modal.classList.add('show');

    });
}

function closeModal(id) {

    const modal =
        document.getElementById(id);

    modal.classList.remove('show');

    setTimeout(() => {

        modal.style.display = 'none';

        const anyOpen =
            document.querySelector(
                '.modal-overlay.show'
            );

        if (!anyOpen) {

            document.body.style.overflow =
                '';

        }

    }, 300);
}

function closeModalOnBg(e, id) {

    if (
        e.target &&
        e.target.id === id
    ) {
        closeModal(id);
    }
}


/* =========================================================
   DATE
========================================================= */

function toggleUnknownDate(id) {

    const el =
        document.getElementById(id);

    if (el.type === 'text') {

        const origType =
            el.getAttribute('data-orig-type') || 'date';

        el.type = origType;

        el.value = '';

    } else {

        el.setAttribute('data-orig-type', el.type);

        el.type = 'text';

        el.value = '不可考';
    }
}

function applyDateVal(id, val, isMonth = false) {

    const el =
        document.getElementById(id);

    if (val === '不可考') {

        el.type = 'text';

        el.value = '不可考';

    } else {

        el.type = isMonth ? 'month' : 'date';

        if (isMonth && val) {
            val = normalizeMonthString(val);
        }

        el.value = val || '';
    }
}


/* =========================================================
   SECTIONS
========================================================= */

function toggleFridge() {

    const area =
        document.getElementById(
            'fridgeArea'
        );

    const button =
        document.querySelector(
            '#section-fridge button'

    container.style.display =

            : 'none';

    button.textContent =
        open
            ? '收起'
            : '展開';

    if (open) {

        renderStatsCharts();
    }
}

function toggleTechFields() {

    const fields =
        document.getElementById(
            'techFields'
        );

    const button =
        document.getElementById(
            'techToggleBtn'

    const open =
        fields.style.display === 'none' ||
        fields.style.display === '';

            : 'none';

            : '⚙️ 進階拍攝設定';
}


/* =========================================================
   GEAR DROPDOWNS
========================================================= */

function renderDropdowns() {

    const fill =
        (
            id,
            arr,
            withFormat = false
        ) => {

            const el =
                document.getElementById(id);

            if (!el) return;

            el.innerHTML =
                arr.map(item => {

                    const value =
                        escapeHTML(
                            item.name
                        );

                    const format =
                        withFormat
                            ? `data-format="${escapeHTML(item.format || '135')}"`
                            : '';

                    return `
                        <option
                            value="${value}"
                            ${format}
                        >
                            ${value}
                        </option>
                    `;

                }).join('');
        };

    fill(
        'camera',
        customCameras,
        true
    );

    fill(
        'qlCamera',
        customCameras,
        true
    );

    fill(
        'film',
        customFilms
    );

    fill(
        'invFilmSelect',
        customFilms
    );

    fill(
        'lens',
        customLenses
    );

    fill(

    );

    fill(
        'qaLab',
        customLabs
    );

    autoSetFormatAndLens();
}

   AUTO CAMERA SETTINGS
========================================================= */

function autoSetFormatAndLens() {

    const camera =
        document.getElementById(
            'camera'
        );

    const format =
        document.getElementById(
            'format'
        );

    if (
        !camera ||
        camera.selectedIndex < 0
    ) return;

    const selected =
        camera.options[
            camera.selectedIndex
        ];

    const targetFormat =
        selected.getAttribute(
            'data-format'
        );

    if (targetFormat) {

        format.value =
            targetFormat;
    }

    const lastRecord =
        [...filmRecords]
            .reverse()
            .find(
                r =>
                    r.camera ===
                    camera.value
            );

    if (
        lastRecord &&
        lastRecord.lens
    ) {

        const lens =
            document.getElementById(
                'lens'
            );

        lens.value =
            lastRecord.lens;
    }
}


/* =========================================================
   GEAR ROOM
========================================================= */

function openGearRoom(tab) {

    switchGearTab(tab);

    openModal(
        'gearRoomModal'
    );
}

function switchGearTab(tab) {

    currentGearTab = tab;

    [
        'camera',
        'film',
        'lens',
        'lab'
    ].forEach(type => {

        const el =
            document.getElementById(
                `tab-${type}`
            );

        if (el) {

            el.classList.toggle(
                'active',
                type === tab
            );
        }
    });

    renderGearList(tab);
}

function getGearArray(tab) {

    if (tab === 'camera')
        return customCameras;

    if (tab === 'film')
        return customFilms;

    if (tab === 'lens')
        return customLenses;

    return customLabs;
}

function renderGearList(tab) {

    const list =
        document.getElementById(
            'gearList'
        );

    const data =
        getGearArray(tab);

    if (!data.length) {

        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">⚙️</div>
                <strong>還沒有項目</strong>
                <p>建立第一個 ${escapeHTML(tab)} 項目。</p>
            </div>
        `;

        return;
    }

    list.innerHTML =
        data.map(
            (item, index) => {

                let meta = '';

                if (tab === 'camera') {

                    meta =
                        `片幅 · ${item.format || '135'}`;

                } else if (tab === 'film') {

                    const typeStr = (item.colorType === 'B/W' || item.colorType === '黑白') ? '黑白' : '彩色';
                    meta =
                        `ISO ${item.iso || 400} · ${item.exposures || 36} 張 · 片幅 ${item.format || '135'} · ${typeStr}`;

                }

                return `
                    <div class="gear-item">

                        <div class="gear-item-main">

                            <span class="gear-item-name">
                                ${escapeHTML(item.name)}
                            </span>

                            ${
                                meta
                                    ? `
                                        <span class="gear-item-meta">
                                            ${escapeHTML(meta)}
                                        </span>
                                      `
                                    : ''
                            }

                        </div>

                        <div class="gear-actions">

                            <button
                                class="btn-gear-edit"
                                onclick="openGearEditor('${tab}',${index})"
                            >
                                編輯
                            </button>

                            <button
                                class="btn-gear-del"
                                onclick="deleteGearItem('${tab}',${index})"
                            >
                                刪除
                            </button>

                        </div>

                    </div>
                `;

            }
        ).join('');
}

function triggerAddGearFromRoom() {

    openGearEditor(
        currentGearTab,
        -1
    );
}

function openGearEditor(
    type,
    index
) {

    document.getElementById(
        'geType'
    ).value = type;

    document.getElementById(
        'geIndex'
    ).value = index;

    document.getElementById(
        'gearEditTitle'
    ).textContent =
        index === -1
            ? '✨ 新增項目'
            : '✏️ 編輯項目';

    document.getElementById(
        'geFormatContainer'
    ).style.display =
        'none';

    document.getElementById(
        'geFilmMetaContainer'
    ).style.display =
        'none';

    let item = {
        name: '',
        format: '135',
        iso: 400,
        exposures: 36,

    };

function deleteGearItem(
    type,
    index
) {

    const data =
        getGearArray(type);

    const item =
        data[index];

    if (!item) return;

    if (
        !confirm(
            `確定刪除「${item.name}」？`
        )
    ) return;

    data.splice(index, 1);

    saveAllGear();

    renderDropdowns();

    if (
        document
            .getElementById(
                'gearRoomModal'
            )
            .classList.contains(
                'show'
            )
    ) {

        renderGearList(type);
    }

    renderInventory();
    renderRecords();
    renderStats();
    updateHero();

    showToast(
        `已刪除 ${item.name}`
    );
}

function saveGearItem() {

    const type =
        document.getElementById(
            'geType'
        ).value;

    const index =
        parseInt(
            document.getElementById(
                'geIndex'
            ).value,
            10
        );

    const name =
        document.getElementById(
            'geName'
        ).value.trim();

    if (!name) {

        showToast(
            '名稱不可為空',
            'error'
        );

        return;
    }

    const newItem = {
        name
    };

    if (type === 'camera') {

        newItem.format =
            document.getElementById(
                'geFormat'
            ).value;

    } else if (type === 'film') {

        newItem.iso =
            parseInt(
                document.getElementById(
                    'geIso'
                ).value,
                10
            ) || 400;

        newItem.exposures =
            parseInt(
                document.getElementById(
                    'geExposures'
                ).value,
                10
            ) || 36;

        newItem.format =
            document.getElementById(
                'geFilmFormat'
            ).value || '135';

        newItem.colorType =
            document.getElementById(
                'geFilmColorType'
            ).value || 'Color';
    }

    const target =
        getGearArray(type);

    // CASCADE RENAMING LINKAGE
    if (index !== -1) {
        const oldItem = target[index];
        const oldName = oldItem ? oldItem.name : '';
        if (oldName && oldName !== name) {
            inventory.forEach(inv => {
                if (inv.name === oldName) inv.name = name;
            });

            filmRecords.forEach(rec => {
                if (type === 'camera' && rec.camera === oldName) rec.camera = name;
                if (type === 'film' && rec.film === oldName) rec.film = name;
                if (type === 'lens' && rec.lens === oldName) rec.lens = name;
                if (type === 'lab' && rec.lab === oldName) rec.lab = name;
            });

            safeSetStorage('filmTrackerRecords', JSON.stringify(filmRecords));
            safeSetStorage('filmInventory', JSON.stringify(inventory));
        }
        target[index] = newItem;
    } else {
        target.push(newItem);
    }

    saveAllGear();

    renderDropdowns();

    if (
        document
            .getElementById(
                'gearRoomModal'
            )
            .classList.contains(
                'show'
            )
    ) {

        renderGearList(type);
    }

    renderInventory();
    renderRecords();
    renderStats();
    updateHero();

    closeModal(
        'gearEditModal'
    );

    showToast(
        index === -1
            ? '已新增項目'
            : '已更新項目與連動資料'
    );
}

function saveAllGear() {

    safeSetStorage(
        'customCameras',
        JSON.stringify(
            customCameras
        )
    );

    safeSetStorage(
        'customFilms',
        JSON.stringify(
            customFilms
        )
    );

    safeSetStorage(
        'customLenses',
        JSON.stringify(
            customLenses
        )
    );

    safeSetStorage(
        'customLabs',
        JSON.stringify(

        )
    );
}

    );

    );

function getExpiryText(expiryDateStr) {
    if (!expiryDateStr || expiryDateStr === '不可考') return '';

    const norm = normalizeMonthString(expiryDateStr);
    if (!norm || !norm.includes('-')) {
        return `效期 ${escapeHTML(expiryDateStr)}`;
    }

    const parts = norm.split('-');
    const expYear = parseInt(parts[0], 10);
    const expMonth = parseInt(parts[1], 10);

    if (isNaN(expYear) || isNaN(expMonth)) return '';

    const now = new Date();
    const curYear = now.getFullYear();
    const curMonth = now.getMonth() + 1;

    const expTotalMonths = expYear * 12 + expMonth;
    const curTotalMonths = curYear * 12 + curMonth;

    const diffMonths = expTotalMonths - curTotalMonths;

    if (diffMonths < 0) {
        const absDiff = Math.abs(diffMonths);
        const years = Math.floor(absDiff / 12);
        const months = absDiff % 12;

        let timeStr = '';
        if (years > 0 && months > 0) {
            timeStr = `${years} 年 ${months} 個月`;
        } else if (years > 0) {
            timeStr = `${years} 年`;
        } else {
            timeStr = `${months} 個月`;
        }
        return `<span class="stock-danger">已過期 ${timeStr}</span>`;
    } else if (diffMonths <= 2) {
        return `<span class="stock-warning">約 ${diffMonths} 個月後到期 (效期 ${expYear}/${String(expMonth).padStart(2,'0')})</span>`;
    } else {
        return `效期 ${expYear}/${String(expMonth).padStart(2,'0')}`;
    }
}

function renderInventory() {

    const list =
        document.getElementById(
            'inventoryList'
        );

    const total =
        getInventoryTotal();

    document.getElementById(
        'inventoryTotal'
    ).textContent =
        `${total} 卷`;

    if (!inventory.length) {

        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">❄️</div>
                <strong>冰箱目前是空的</strong>
                <p>把新的底片存進來吧。</p>
            </div>
        `;

        updateInventoryAlert();

        return;
    }

    // DYNAMIC METADATA LINKAGE WITH GEAR ROOM MASTER DATA
    let mappedInventory = inventory.map((item, originalIndex) => {
        const matched = customFilms.find(f => f.name === item.name) || {};
        return {
            ...item,
            originalIndex,
            format: matched.format || '135',
            colorType: matched.colorType || 'Color',
            iso: matched.iso || 400,
            packaging: item.packaging || '原裝'
        };
    });

    const colorFilms = mappedInventory
        .filter(i => i.colorType !== 'B/W' && i.colorType !== '黑白')
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-TW'));

    const bwFilms = mappedInventory
        .filter(i => i.colorType === 'B/W' || i.colorType === '黑白')
        .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-TW'));

    const renderCard = (item) => {
        const qty = Number(item.qty) || 0;
        const idx = item.originalIndex;

        let stockClass = 'stock-good';
        if (qty <= 2) stockClass = 'stock-warning';
        if (qty <= 0) stockClass = 'stock-danger';

        const expiryText = getExpiryText(item.expiryDate);

        const isBW = item.colorType === 'B/W' || item.colorType === '黑白';
        const typeLabel = isBW ? 'B/W' : 'Color';
        const typeBadgeStyle = isBW
            ? 'background:var(--text-main); color:var(--bg-color);'
            : 'background:var(--accent-light); color:var(--accent);';

        const isBulk = item.packaging === '分裝';
        const pkgBadgeStyle = isBulk
            ? 'background:var(--warning-bg); color:var(--warning); font-weight:800;'
            : '';

        return `
            <div class="fridge-item">

                <div class="fridge-info">

                    <div class="fridge-name">
                        ${escapeHTML(item.name)}
                        ×
                        <span class="${stockClass}">
                            ${qty}
                        </span>
                        卷
                    </div>

                    <div class="fridge-meta">

                        ${
                            item.cost
                                ? `NT$ ${formatMoney(item.cost)} / 卷`
                                : '成本未標'
                        }

                        ${
                            expiryText
                                ? ` · ${expiryText}`
                                : ''
                        }

                    </div>

                    <div style="display:flex; gap:5px; margin-top:6px; flex-wrap:wrap;">

                        <span class="setting-chip" style="font-size:9px; ${pkgBadgeStyle}">
                            ${escapeHTML(item.packaging)}
                        </span>

                        <span class="setting-chip" style="font-size:9px;">
                            ${escapeHTML(item.format)}
                        </span>

                        <span class="setting-chip" style="font-size:9px; ${typeBadgeStyle}">
                            ${escapeHTML(typeLabel)}
                        </span>

                        <span class="setting-chip" style="font-size:9px;">
                            ISO ${escapeHTML(item.iso)}
                        </span>

                    </div>

                </div>

                <div class="fridge-actions">

                    <button
                        class="btn-inline"
                        onclick="initQuickLoad(${idx})"
                        title="快速上片"
                    >
                        📷
                    </button>

                    <button
                        class="btn-inline"
                        onclick="openInventoryEdit(${idx})"
                    >
                        編輯
                    </button>

                    <button
                        class="btn-inline"
                        onclick="removeInventory(${idx})"
                    >
                        消耗
                    </button>

                </div>

            </div>
        `;
    };

    let html = '';

    if (colorFilms.length > 0) {
        html += `
            <div style="margin-bottom:14px;">
                <div style="font-size:11px; font-weight:800; color:var(--accent); margin-bottom:6px; letter-spacing:0.5px;">
                    🌈 彩色底片 COLOR (${colorFilms.length})
                </div>
                ${colorFilms.map(renderCard).join('')}
            </div>
        `;
    }

    if (bwFilms.length > 0) {
        html += `
            <div style="margin-bottom:14px;">
                <div style="font-size:11px; font-weight:800; color:var(--text-sub); margin-bottom:6px; letter-spacing:0.5px;">
                    ◼️ 黑白底片 BLACK & WHITE (${bwFilms.length})
                </div>
                ${bwFilms.map(renderCard).join('')}
            </div>
        `;
    }

    list.innerHTML = html;

    updateInventoryAlert();
}

function updateInventoryAlert() {

    const alert =
        document.getElementById(
            'inventoryAlert'
        );

    const low =
        inventory.filter(
            item =>
                Number(item.qty) <= 2
        );

    const expired =
        inventory.filter(
            item => {

                if (
                    !item.expiryDate ||
                    item.expiryDate === '不可考'
                ) return false;

                const norm = normalizeMonthString(item.expiryDate);
                if (!norm || !norm.includes('-')) return false;

                const parts = norm.split('-');
                const expYear = parseInt(parts[0], 10);
                const expMonth = parseInt(parts[1], 10);

                if (isNaN(expYear) || isNaN(expMonth)) return false;

                const now = new Date();
                const curYear = now.getFullYear();
                const curMonth = now.getMonth() + 1;

                return (expYear * 12 + expMonth) < (curYear * 12 + curMonth);
            }
        );

    if (
        !low.length &&
        !expired.length
    ) {

        alert.style.display =
            'none';

        return;
    }

    alert.style.display =
        'flex';

    if (expired.length) {

        alert.innerHTML =
            `⚠️ 有 ${expired.length} 種底片已過期`;

    } else {

        alert.innerHTML =
            `📦 有 ${low.length} 種底片庫存偏低`;
    }
}

            todayString(),

        unloadDate: '',

        labDate: '',

        devTime: '',

function renderStats() {

    const statsArea =
        document.getElementById(
            'statsArea'
        );

    if (!filmRecords.length) {

        statsArea.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📊</div>
                <strong>尚無紀錄資料</strong>
                <p>開始拍第一卷底片後，這裡會自動統計。</p>
            </div>
        `;

        updateHero();

        return;
    }

    let totalCost = 0;

    let loadedCount = 0;

    let labCount = 0;

    let completedCount = 0;

    filmRecords.forEach(r => {

        totalCost +=
            Number(r.filmCost) || 0;

        totalCost +=
            Number(r.labCost) || 0;

        if (
            r.status === '拍攝中'
        )
            loadedCount++;

        if (
            r.status === '送洗中'
        )
            labCount++;

        if (
            r.status === '已完成'
        )
            completedCount++;
    });

    statsArea.innerHTML = `

        <div class="dashboard-grid">

            <div
                class="dash-card full-width"
                style="
                    border-left:
                        4px solid var(--accent);
                "
            >

                <h4>
                    🔥 累計燃燒金額
                </h4>

                <p class="value accent">
                    NT$ ${formatMoney(totalCost)}
                </p>

function renderStatsCharts() {

    if (
        typeof Chart === 'undefined'
    ) return;

    const filmCounts = {};

    const gearCounts = {};

    filmRecords.forEach(r => {

        if (r.film) {

            filmCounts[r.film] =
                (
                    filmCounts[r.film] ||
                    0
                ) + 1;
        }

        if (r.camera) {

            gearCounts[r.camera] =
                (
                    gearCounts[r.camera] ||
                    0
                ) + 1;
        }
    });

    if (filmChartInstance) {

        filmChartInstance.destroy();

        filmChartInstance =
            null;
    }

    if (gearChartInstance) {

        gearChartInstance.destroy();

        gearChartInstance =
            null;
    }

    const filmCanvas =
        document.getElementById(
            'filmChart'
        );

    const gearCanvas =
        document.getElementById(
            'gearChart'
        );

    if (!filmCanvas || !gearCanvas)
        return;

    const isDark =
        document.documentElement
            .getAttribute(
                'data-theme'
            ) === 'dark';

    const textColor =
        isDark
            ? '#e8e8e8'
            : '#2d2d2d';

    const gridColor =
        isDark
            ? '#333333'
            : '#eaeaea';

    filmChartInstance =
        new Chart(
            filmCanvas.getContext('2d'),
            {

                type: 'doughnut',

                data: {

                    labels:
                        Object.keys(
                            filmCounts
                        ),

                    datasets: [

                        {

                            data:
                                Object.values(
                                    filmCounts
                                ),

                            backgroundColor: [
                                '#e67e22',
                                '#d35400',
                                '#f1c40f',
                                '#34495e',
                                '#7f8c8d',
                                '#8e44ad',
                                '#27ae60'
                            ],

                            borderColor:
                                isDark
                                    ? '#1a1a1a'
                                    : '#ffffff',

                            borderWidth: 2
                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio:
                        false,

                    cutout: '64%',

                    plugins: {

                        legend: {

                            position:
                                'bottom',

                            labels: {

                                color:
                                    textColor,

                                font: {
                                    size: 9
                                },

                                padding: 10
                            }
                        }

                    }

                }

            }
        );


    gearChartInstance =
        new Chart(
            gearCanvas.getContext('2d'),
            {

                type: 'bar',

                data: {

                    labels:
                        Object.keys(
                            gearCounts
                        ),

                    datasets: [

                        {

                            data:
                                Object.values(
                                    gearCounts
                                ),

                            backgroundColor:
                                'rgba(230,126,34,.72)',

                            borderColor:
                                '#e67e22',

                            borderWidth: 1,

                            borderRadius: 6

                        }

                    ]

                },

                options: {

                    responsive: true,

                    maintainAspectRatio:
                        false,

                    indexAxis: 'y',

                    plugins: {

                        legend: {
                            display: false
                        }

                    },

                    scales: {

                        x: {

                            beginAtZero: true,

                            grid: {
                                color:
                                    gridColor
                            },

                            ticks: {
                                color:
                                    textColor,

                                precision: 0
                            }

                        },

                        y: {

                            grid: {
                                display: false
                            },

                            ticks: {
                                color:
                                    textColor,

                                font: {
                                    size: 10
                                }
                            }

                        }

                    }

                }

            }
        );
}

function triggerSmartAction(
    index,
    actionType
) {

    const record =
        filmRecords[index];

    if (!record) return;

    const cardEl =
        document.getElementById(
            'record-card-' + index
        );

    if (
        actionType === 'unload'
    ) {

        if (cardEl) {

            cardEl.classList.add(
                'chem-fade-out'
            );
        }

        setTimeout(() => {

            const current =
                filmRecords[index];

            if (!current) return;

            current.status =
                '已退片';

            current.unloadDate =
                todayString();

            safeSetStorage(
                'filmTrackerRecords',
                JSON.stringify(
                    filmRecords
                )
            );

            renderRecords();

            renderStats();

            updateHero();

            showToast(
                '🎞️ 已退片',
                'success'
            );

        }, 300);

        return;
    }


    smartActionRecIndex =
        index;

    smartActionType =
        actionType;


    if (
        actionType === 'lab'
    ) {

        document.getElementById(
            'qaTitle'
        ).textContent =
            '🧪 準備送洗';

        document.getElementById(
            'qaLabSection'
        ).style.display =
            'block';

        document.getElementById(
            'qaDoneSection'
        ).style.display =
            'none';

        document.getElementById(
            'qaLab'
        ).value =
            record.lab ||
            '未指定';

        document.getElementById(
            'qaDevChemRatio'
        ).value =
            record.devChemRatio || '';

        document.getElementById(
            'qaDevTime'
        ).value =
            record.devTime || '';

        checkQaSelfDev();

        openModal(
            'quickActionModal'
        );

    } else if (
        actionType === 'done'
    ) {

        document.getElementById(
            'qaTitle'
        ).textContent =
            '✅ 歸檔圖檔';

        document.getElementById(
            'qaLabSection'
        ).style.display =
            'none';

        document.getElementById(
            'qaDoneSection'
        ).style.display =
            'block';

        document.getElementById(
            'qaLabCost'
        ).value =
            record.labCost ||
            '';

        document.getElementById(
            'qaDriveLink'
        ).value =
            record.driveLink ||
            '';

        openModal(
            'quickActionModal'
        );
    }
}

function confirmQuickAction() {

    if (
        smartActionRecIndex === -1
    ) return;

    const record =
        filmRecords[
            smartActionRecIndex
        ];

    if (!record) return;

    const today =
        todayString();


    if (
        smartActionType === 'lab'
    ) {

        record.status =
            '送洗中';

        record.labDate =
            today;

        record.lab =
            document.getElementById(
                'qaLab'
            ).value;

        if (record.lab === '自行沖洗') {
            record.devChemRatio = document.getElementById('qaDevChemRatio').value.trim();
            record.devTime = document.getElementById('qaDevTime').value.trim();
        }

        showToast(
            '🧪 已送洗'
        );

    } else if (
        smartActionType === 'done'
    ) {

        const drive =
            document.getElementById(
                'qaDriveLink'

        if (drive) {

            const valid =
                safeURL(drive);

            if (!valid) {

                showToast(

                    'error'
                );

                return;
            }

            record.driveLink =
                valid;
        }

        record.status =

        record.labCost =
            document.getElementById(
                'qaLabCost'
            ).value;

        showToast(
            '✅ 已完成歸檔'
        );
    }

    safeSetStorage(
        'filmTrackerRecords',

            filmRecords

    );

    smartActionRecIndex = -1;

    smartActionType = '';

    closeModal(
        'quickActionModal'
    );

    renderRecords();

    renderStats();

    updateHero();
}

========================================================= */

function deleteRecord(index) {

    const record =
        filmRecords[index];

    if (!record) return;

    if (
        !confirm(
            `確定刪除「${record.camera} · ${record.film}」？`
        )
    ) return;

    const backup =
        JSON.parse(
            JSON.stringify(record)
        );

    filmRecords.splice(
        index,
        1
    );

    safeSetStorage(
        'filmTrackerRecords',
        JSON.stringify(
            filmRecords
        )
    );

    renderRecords();

    renderStats();

    updateHero();

    showToast(
        '已刪除紀錄',
        'success',
        '復原',
        () => {

            filmRecords.splice(
                index,
                0,
                backup
            );

            safeSetStorage(
                'filmTrackerRecords',
                JSON.stringify(
                    filmRecords
                )
            );

            renderRecords();

            renderStats();

            updateHero();

            showToast(
                '✓ 已復原'
            );
        }
    );
}

   RENDER RECORDS
========================================================= */

function renderRecords() {

    const list =
        document.getElementById(
            'recordList'
        );

    const filterVal =
        document.getElementById(
            'filterStatus'
        ).value;

    const query =
        document.getElementById(
            'searchInput'
        ).value
            .toLowerCase()
            .trim();


    let displayRecords =
        filmRecords
            .map(
                (record, idx) => ({
                    ...record,
                    originalIndex: idx
                })
            )
            .reverse();


    if (
        filterVal !== '全部'
    ) {

        displayRecords =
            displayRecords.filter(
                r =>
                    r.status ===
                    filterVal
            );
    }


    if (query) {

        displayRecords =
            displayRecords.filter(
                r => {

                    const haystack =
                        [
                            r.camera,
                            r.film,
                            r.notes,
                            r.status,
                            r.lens,
                            r.lab,
                            r.devChemRatio,
                            r.devTime
                        ]
                            .join(' ')
                            .toLowerCase();

                    return haystack
                        .includes(
                            query
                        );
                }
            );
    }


    if (
        displayRecords.length === 0
    ) {

        list.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🎞️
                </div>

                <strong>
                    沒有找到紀錄
                </strong>

                <p>
                    試試其他搜尋條件，或開始記錄下一卷底片。
                </p>

            </div>

        `;

        return;
    }


    list.innerHTML =
        displayRecords
            .map(record =>
                renderRecordCard(
                    record
                )
            )
            .join('');
}

function renderRecordCard(
    record
) {

    const index =
        record.originalIndex;

    const badgeClass =
        getStatusClass(
            record.status
        );


    let progressW = '0%';

    let states = [
        '',
        '',
        '',
        ''
    ];


    if (
        record.status ===
        '拍攝中'
    ) {

        progressW =
            '0%';

        states[0] =
            'active';

    } else if (
        record.status ===
        '已退片'
    ) {

        progressW =
            '33%';

        states[0] =
            'active';

        states[1] =
            'active';

    } else if (
        record.status ===
        '送洗中'
    ) {

        progressW =
            '66%';

        states[0] =
            'active';

        states[1] =
            'active';

        states[2] =
            'active';

    } else if (
        record.status ===
        '已完成'
    ) {

        progressW =
            '100%';

        states =
            [
                'active',
                'active',
                'active',
                'active'

    let quickButton = '';

    if (
        record.status ===

    const boxIsoStr = matchedFilm.iso ? `ISO ${matchedFilm.iso}` : '';

            dateHTML += `<br><strong>沖洗配方</strong> ${escapeHTML(record.devChemRatio || '未填')} · ${escapeHTML(record.devTime || '未填')}`;
        }
    }


    const totalCost =
        (
            Number(
                record.filmCost

        (
            Number(
                record.labCost

    let driveButton = '';

        safeURL(
            record.driveLink

                onclick='window.open(${JSON.stringify(driveURL)},"_blank","noopener,noreferrer")'
            >
                🔗 圖檔

            id="record-card-${index}"

                <div>

                    <div class="record-camera">
                        ${escapeHTML(record.camera)}
                    </div>

                    <div class="record-film">

                        <span>
                            ${escapeHTML(record.film)}
                        </span>

                        <span class="separator">
                            ·
                        </span>

                            ${escapeHTML(record.format || matchedFilm.format || '135')}

                                ? `
                                    <span class="separator">·</span>
                                    <span style="font-weight:700; color:var(--accent);">
                                        ${escapeHTML(typeLabel)}
                                    </span>
                                  `
                                : ''
                        }

                    </div>

                </div>


                <span
                    class="status-badge ${badgeClass}"
