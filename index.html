            </div>


            <div class="visual-timeline">

                <div
                    class="timeline-track"
                    style="width:${progressW}"
                ></div>

                <div
                    class="timeline-dot ${states[0]}"
                >
                    <span class="timeline-lbl">
                        拍攝
                    </span>
                </div>

                <div
                    class="timeline-dot ${states[1]}"
                >
                    <span class="timeline-lbl">
                        退片
                    </span>
                </div>

                <div
                    class="timeline-dot ${states[2]}"
                >
                    <span class="timeline-lbl">
                        送洗
                    </span>
                </div>

                <div
                    class="timeline-dot ${states[3]}"
                >
                    <span class="timeline-lbl">
                        完成
                    </span>
                </div>

            </div>


            <div class="record-setting">

                <span class="setting-chip">
                    鏡頭 · ${escapeHTML(record.lens || '未記錄')}
                </span>

                <span class="setting-chip">
                    EI · ${escapeHTML(record.iso || '正常')}
                </span>

                ${
                    boxIsoStr
                        ? `<span class="setting-chip">原廠 ${boxIsoStr}</span>`
                        : ''
                }

            </div>


            <div class="record-info-box">

                ${dateHTML || '尚未記錄時間'}

            </div>


            <div class="record-note-row">

                <div class="record-note">
                    <strong>拍攝日誌：</strong>
                    ${note}
                </div>

                <div class="record-cost">
                    NT$ ${formatMoney(totalCost)}
                </div>

            </div>


            <div class="smart-action-group">
                ${quickButton}
            </div>


            <div class="pro-action-bar">

                <button
                    class="btn-pro-edit"
                    onclick="openMainForm(${index})"
                >
                    📝 編輯
                </button>

                ${driveButton}

                <button
                    class="btn-pro-delete"
                    onclick="deleteRecord(${index})"
                    title="刪除"
                >
                    🗑️
                </button>

            </div>

        </article>

    `;
}


/* =========================================================
   CSV EXPORT
========================================================= */

function csvEscape(value) {

    const str =
        String(value ?? '');

    return `"${str.replace(
        /"/g,
        '""'
    )}"`;
}

function exportToCSV() {

    const header = [
        '狀態',
        '相機',
        '底片',
        '片幅',
        'EI值',
        '鏡頭',
        '上片日期',
        '退片日期',
        '送洗店',
        '顯影藥水比例',
        '顯影時間',
        '送洗日期',
        '底片成本',
        '沖掃費',
        '總成本',
        'Drive',
        '拍攝日誌'
    ];

    const rows =
        filmRecords.map(
            r => [

                r.status,
                r.camera,
                r.film,
                r.format,
                r.iso,
                r.lens,
                r.loadDate,
                r.unloadDate,
                r.lab,
                r.devChemRatio,
                r.devTime,
                r.labDate,
                r.filmCost,
                r.labCost,
                (
                    Number(r.filmCost) ||
                    0
                ) +
                (
                    Number(r.labCost) ||
                    0
                ),
                r.driveLink,
                r.notes

            ]
        );


    const csv =
        '\uFEFF' +
        [
            header,
            ...rows
        ]
            .map(
                row =>
                    row
                        .map(csvEscape)
                        .join(',')
            )
            .join('\n');


    const blob =
        new Blob(
            [csv],
            {
                type:
                    'text/csv;charset=utf-8;'
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            'a'
        );

    link.href = url;

    link.download =
        `FilmAsset_MAX_${todayString()}.csv`;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    showToast(
        '📥 CSV 已匯出'
    );
}


/* =========================================================
   BACKUP
========================================================= */

function exportBackup() {

    const data = {

        version: 3,

        exportedAt:
            new Date().toISOString(),

        filmTrackerRecords:
            filmRecords,

        filmInventory:
            inventory,

        customCameras,
        customFilms,
        customLenses,
        customLabs

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],
            {
                type:
                    'application/json'
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            'a'
        );

    link.href = url;

    link.download =
        `FilmAsset_MAX_Backup_${todayString()}.json`;

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    showToast(
        '📦 完整備份已匯出'
    );
}

function importBackupFile(event) {

    const file =
        event.target.files?.[0];

    if (!file) return;

    if (
        !confirm(
            '⚠️ 匯入後會覆蓋目前資料。\n\n確定要繼續嗎？'
        )
    ) {

        event.target.value = '';

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function (e) {

            try {

                const data =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !Array.isArray(
                        data.filmTrackerRecords
                    )
                ) {

                    throw new Error(
                        '缺少紀錄資料'
                    );
                }


                filmRecords =
                    data.filmTrackerRecords;

                inventory =
                    Array.isArray(
                        data.filmInventory
                    )
                        ? data.filmInventory
                        : [];


                if (
                    Array.isArray(
                        data.customCameras
                    )
                ) {

                    customCameras =
                        data.customCameras;
                }

                if (
                    Array.isArray(
                        data.customFilms
                    )
                ) {

                    customFilms =
                        data.customFilms;
                }

                if (
                    Array.isArray(
                        data.customLenses
                    )
                ) {

                    customLenses =
                        data.customLenses;
                }

                if (
                    Array.isArray(
                        data.customLabs
                    )
                ) {

                    customLabs =
                        data.customLabs;
                }


                safeSetStorage(
                    'filmTrackerRecords',
                    JSON.stringify(
                        filmRecords
                    )
                );

                safeSetStorage(
                    'filmInventory',
                    JSON.stringify(
                        inventory
                    )
                );

                saveAllGear();


                renderDropdowns();

                renderInventory();

                renderRecords();

                renderStats();

                updateHero();


                showToast(
                    '✓ 完整資料匯入成功'
                );

            } catch (error) {

                console.error(
                    error
                );

                showToast(
                    '匯入失敗：檔案格式不正確',
                    'error'
                );
            }

            event.target.value = '';
        };


    reader.readAsText(
        file
    );
}


/* =========================================================
   KEYBOARD / BACK
========================================================= */

document.addEventListener(
    'keydown',
    event => {

        if (
            event.key !== 'Escape'
        ) return;

        const modals =
            [
                'invEditModal',
                'quickActionModal',
                'quickLoadModal',
                'gearEditModal',
                'gearRoomModal',
                'mainFormModal'
            ];

        for (
            const id of modals
        ) {

            const modal =
                document.getElementById(
                    id
                );

            if (
                modal &&
                modal.classList.contains(
                    'show'
                )
            ) {

                closeModal(id);

                break;
            }
        }
    }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
    'serviceWorker' in navigator
) {

    window.addEventListener(
        'load',
        () => {

            navigator.serviceWorker
                .register(
                    './service-worker.js'
                )
                .then(
                    registration => {

                        console.log(

                            registration.scope
                        );

                    }
                )
                .catch(
                    error => {

                        console.log(
                            'Service Worker unavailable:',
                            error
                        );
                    }
                );
        }
    );
}
